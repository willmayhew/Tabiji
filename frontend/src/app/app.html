<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="app-header">
  <div class="app-header__inner">
    <a class="brand" routerLink="/">
      <span class="brand-mark" aria-hidden="true">旅</span>
      <span class="brand-name">Tabiji</span>
    </a>

    <nav class="app-nav" aria-label="Main">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Overview</a
      >
      <a routerLink="/trips" routerLinkActive="is-active" ariaCurrentWhenActive="page">Trips</a>
    </nav>

    <div class="app-header__actions">
      <a class="button button--secondary" routerLink="/trips/new">New trip</a>
    </div>
  </div>
</header>

<main class="app-main" id="main-content" tabindex="-1">
  <router-outlet />
</main>

<footer class="app-footer">
  <div class="app-footer__inner">
    <span class="app-footer__mark" aria-hidden="true">旅</span>
    <p class="app-footer__note">A collaborative travel planner.</p>
  </div>
</footer>
