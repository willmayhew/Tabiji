<div class="empty-state">
  <svg class="empty-state__motif" viewBox="0 0 120 48" focusable="false" aria-hidden="true">
    <path class="empty-state__graticule" d="M 20 0 L 20 48 M 48 0 L 48 48 M 76 0 L 76 48 M 100 0 L 100 48" />
    <path class="empty-state__route" d="M 6 38 C 30 6 46 42 66 20 S 104 4 114 14" />
    <circle class="empty-state__node" cx="6" cy="38" r="1.6" />
    <circle class="empty-state__node empty-state__node--end" cx="114" cy="14" r="1.6" />
  </svg>

  @if (level() === 1) {
    <h1 class="empty-state__title">Sign in to carry on</h1>
  } @else {
    <h2 class="empty-state__title">Sign in to carry on</h2>
  }

  <p class="empty-state__body">{{ message() }}</p>
  <a class="button" routerLink="/login" [queryParams]="{ returnUrl: returnUrl() }">Sign in</a>
</div>
