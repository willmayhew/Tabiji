@if (photo(); as image) {
  <img
    class="destination-photo__image"
    [src]="image.src"
    [srcset]="image.srcSet"
    [sizes]="sizes()"
    [alt]="image.alt"
    [attr.width]="image.width"
    [attr.height]="image.height"
    [attr.loading]="lazy() ? 'lazy' : 'eager'"
    [attr.fetchpriority]="lazy() ? null : 'high'"
    [attr.decoding]="lazy() ? 'async' : 'sync'"
  />
} @else {
  <span class="destination-photo__fallback" aria-hidden="true">旅</span>
}
